<!-- overlaycs2.html -->
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream Overlay - CS2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  body { background: transparent; font-family: 'Inter', 'Poppins', sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap');

  /* NINCS CHAT - csak social promo */

  /* SOCIAL PROMO - fentről 300px, bal oldalt 20px */
  .social-promo-container { position: fixed; top: 300px; left: 20px; z-index: 99; pointer-events: none; }
  .promo-banner { display: flex; align-items: center; gap: 16px; background: linear-gradient(135deg, rgba(0,0,0,0.9), rgba(0,0,0,0.75)); backdrop-filter: blur(12px); padding: 14px 28px 14px 22px; border-radius: 80px; border-left: 5px solid; box-shadow: 0 6px 20px rgba(0,0,0,0.5); animation: slideInLeft 0.5s ease-out; white-space: nowrap; }
  .promo-banner.hiding { animation: slideOutLeft 0.5s ease-out forwards; }
  .promo-logo { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; }
  .promo-logo img { width: 44px; height: 44px; object-fit: contain; }
  .promo-channel { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.5px; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
  .promo-banner.twitch { border-left-color: #9146ff; }
  .promo-banner.twitch .promo-channel { color: #a970ff; }
  .promo-banner.youtube { border-left-color: #ff0000; }
  .promo-banner.youtube .promo-channel { color: #ff5555; }
  .promo-banner.kick { border-left-color: #53fc18; }
  .promo-banner.kick .promo-channel { color: #7cff44; }
  .promo-banner.instagram { border-left-color: #e4405f; }
  .promo-banner.instagram .promo-channel { color: #ff6b8a; }
  .promo-banner.tiktok { border-left-color: #ff0050; }
  .promo-banner.tiktok .promo-channel { color: #ff3388; }

  .bitrate-alert { display: none; }

  @keyframes slideInLeft { from { opacity: 0; transform: translateX(-120px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes slideOutLeft { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(-120px); } }
</style>
</head>
<body>
<div class="social-promo-container" id="socialPromoContainer"></div>
<div class="bitrate-alert" id="bitrateAlert"></div>

<script>
const WS_HOST = 'streammonitor.fly.dev:3000';
const platformLogos = { twitch: "https://cdn-icons-png.flaticon.com/512/5968/5968819.png", kick: "https://upload.wikimedia.org/wikipedia/commons/d/dd/Kick_logo.svg", youtube: "https://cdn-icons-png.flaticon.com/512/1384/1384060.png", tiktok: "https://cdn-icons-png.flaticon.com/512/3046/3046121.png", instagram: "https://cdn-icons-png.flaticon.com/512/2111/2111463.png" };
const socialPromos = [
  { platform: "twitch", channelName: "csapolevente", logo: "https://cdn-icons-png.flaticon.com/512/5968/5968819.png" },
  { platform: "youtube", channelName: "csapolevente", logo: "https://cdn-icons-png.flaticon.com/512/1384/1384060.png" },
  { platform: "kick", channelName: "csapolevente", logo: "https://upload.wikimedia.org/wikipedia/commons/d/dd/Kick_logo.svg" },
  { platform: "instagram", channelName: "csapolevi", logo: "https://cdn-icons-png.flaticon.com/512/2111/2111463.png" },
  { platform: "tiktok", channelName: "csapolevente", logo: "https://cdn-icons-png.flaticon.com/512/3046/3046121.png" }
];

let promoIndex = 0, currentBanner = null, promoInterval = null, ws = null, reconnectTimer = null;

function showPromoBanner(promoData) {
  const container = document.getElementById('socialPromoContainer');
  if (!container) return;
  if (currentBanner) {
    currentBanner.classList.add('hiding');
    setTimeout(() => { if (currentBanner?.parentNode) currentBanner.remove(); createAndShowBanner(promoData, container); }, 450);
  } else { createAndShowBanner(promoData, container); }
}
function createAndShowBanner(promoData, container) {
  const banner = document.createElement('div');
  banner.className = `promo-banner ${promoData.platform}`;
  banner.innerHTML = `<div class="promo-logo"><img src="${promoData.logo}" alt=""></div><div class="promo-channel">${promoData.channelName}</div>`;
  container.appendChild(banner);
  currentBanner = banner;
  setTimeout(() => {
    if (currentBanner === banner) { banner.classList.add('hiding'); setTimeout(() => { if (banner.parentNode) banner.remove(); if (currentBanner === banner) currentBanner = null; }, 450); }
  }, 5000);
}
function startPromoCycle() { showPromoBanner(socialPromos[0]); promoIndex = 1; promoInterval = setInterval(() => { showPromoBanner(socialPromos[promoIndex % socialPromos.length]); promoIndex++; }, 8000); }

function connectWebSocket() {
  if (reconnectTimer) clearTimeout(reconnectTimer);
  const wsUrl = `ws://${WS_HOST}/ws`;
  try { ws = new WebSocket(wsUrl); } catch(e) { reconnectTimer = setTimeout(connectWebSocket, 3000); return; }
  ws.onopen = () => console.log('[CS2] Csatlakozva');
  ws.onmessage = (event) => { try { const packet = JSON.parse(event.data); } catch(e) {} };
  ws.onclose = () => { reconnectTimer = setTimeout(connectWebSocket, 3000); };
}
startPromoCycle();
connectWebSocket();
</script>
</body>
</html>
